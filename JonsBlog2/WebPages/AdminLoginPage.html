<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/css/output.css" />
    <style>
        .action-row { display: flex; flex-wrap: wrap; gap: 0.75rem; padding-top: 0.5rem; }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid transparent;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        .action-btn:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
        .action-btn-login { background-color: #16a34a; color: #ffffff; }
        .action-btn-login:hover { background-color: #22c55e; }
        .action-btn-logout { background-color: #dc2626; color: #ffffff; border-color: #fecaca; }
        .action-btn-logout:hover { background-color: #ef4444; }
        .action-btn-protected { background-color: #f59e0b; color: #111827; }
        .action-btn-protected:hover { background-color: #fbbf24; }
    </style>
</head>
<body class="min-h-screen bg-blue-700 text-white">
<div>
    <nav>
        <ul class="flex justify-center space-x-4 p-4 bg-gradient-to-tr from-amber-700 via-amber-400 to-yellow-200 rounded-lg text-amber-950 font-bold">
            <li><a href="/blogs/list" class="font-bold text-black hover:text-gray-500">Blog</a></li>
            <li><a href="/admin/login-page" class="font-bold text-black hover:text-gray-500">Admin Login</a></li>
        </ul>
    </nav>
</div>

<div class="flex justify-center px-4 py-8">
    <div class="relative p-6 bg-[#2a2a2a] rounded-[40px] border-[12px] border-[#1a1a1a] shadow-[0_20px_50px_rgba(0,0,0,0.5),inset_0_2px_5px_rgba(255,255,255,0.1)] w-full max-w-xl">
        <div class="rounded-[20px] overflow-hidden shadow-[inset_0_5px_15px_rgba(0,0,0,0.8),0_1px_1px_rgba(255,255,255,0.1)]">
            <div class="bg-zinc-950 p-10 min-h-[300px] relative">
                <div class="w-full max-w-lg mx-auto bg-black shadow-sm border border-slate-200 rounded-lg p-10">
                    <h1 class="font-mono text-green-500 [text-shadow:0_0_5px_rgba(34,197,94,0.8)] text-4xl mb-6 text-center">Admin Login</h1>
                    <p id="status" class="text-center font-mono text-green-500/80 mb-8">Checking login status...</p>

                    <form id="login-form" class="space-y-4">
                        <div>
                            <label for="username" class="block mb-2 font-mono text-green-500">Username</label>
                            <input id="username" name="username" type="text" autocomplete="username" class="w-full rounded-md border border-zinc-700 bg-zinc-900 px-4 py-3 text-white focus:border-green-500 focus:outline-none" required />
                        </div>

                        <div>
                            <label for="password" class="block mb-2 font-mono text-green-500">Password</label>
                            <input id="password" name="password" type="password" autocomplete="current-password" class="w-full rounded-md border border-zinc-700 bg-zinc-900 px-4 py-3 text-white focus:border-green-500 focus:outline-none" required />
                        </div>

                        <div class="action-row flex flex-wrap gap-3 pt-2">
                            <button type="submit" class="action-btn action-btn-login rounded-md bg-green-600 px-4 py-2 font-semibold text-white hover:bg-green-500">Log In</button>
                            <button id="logout-button" type="button" class="action-btn action-btn-logout rounded-md border border-red-200 bg-red-600 px-4 py-2 font-semibold text-white shadow-md hover:bg-red-500" style="background-color:#dc2626;color:#ffffff;border:1px solid #fecaca;">Log Out</button>
                            <a href="/admin/me" class="action-btn action-btn-protected rounded-md bg-amber-600 px-4 py-2 font-semibold text-black hover:bg-amber-500">Protected Admin Endpoint</a>
                        </div>
                    </form>

                    <p id="message" class="mt-6 text-center font-mono text-sm"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const statusElement = document.getElementById('status');
    const messageElement = document.getElementById('message');
    const loginForm = document.getElementById('login-form');
    const logoutButton = document.getElementById('logout-button');

    function setMessage(text, isError = false) {
        messageElement.textContent = text;
        messageElement.className = `mt-6 text-center font-mono text-sm ${isError ? 'text-red-400' : 'text-green-400'}`;
    }

    async function refreshStatus() {
        const response = await fetch('/admin/status', { credentials: 'same-origin' });
        const data = await response.json();

        if (data.isAuthenticated) {
            statusElement.textContent = `Logged in as ${data.username}`;
        } else {
            statusElement.textContent = 'Not currently logged in.';
        }
    }

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();

        const formData = new FormData(loginForm);
        const payload = {
            username: formData.get('username'),
            password: formData.get('password')
        };

        const response = await fetch('/admin/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            setMessage(data.message ?? 'Login failed.', true);
            await refreshStatus();
            return;
        }

        setMessage(data.message ?? 'Login successful.');
        loginForm.reset();
        await refreshStatus();
    });

    logoutButton.addEventListener('click', async () => {
        const response = await fetch('/admin/logout', {
            method: 'POST',
            credentials: 'same-origin'
        });

        const data = response.ok ? await response.json() : { message: 'Logout failed.' };
        setMessage(data.message ?? 'Logout complete.', !response.ok);
        await refreshStatus();
    });

    refreshStatus().catch(() => {
        statusElement.textContent = 'Unable to load login status.';
        setMessage('Failed to contact the admin service.', true);
    });
</script>
</body>
</html>
