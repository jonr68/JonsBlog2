<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write Blog Post</title>
    <link rel="stylesheet" href="/css/output.css" />
    <style>
        .action-row { display: flex; flex-wrap: wrap; gap: 0.75rem; padding-top: 0.5rem; }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid transparent;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }
        .action-btn:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
        .action-btn-save { background-color: #16a34a; color: #ffffff; }
        .action-btn-save:hover { background-color: #22c55e; }
        .action-btn-list { background-color: #f59e0b; color: #111827; }
        .action-btn-list:hover { background-color: #fbbf24; }
    </style>
</head>
<body class="min-h-screen bg-blue-700 text-white">
<div>
    <nav>
        <ul class="flex justify-center space-x-4 p-4 bg-gradient-to-tr from-amber-700 via-amber-400 to-yellow-200 rounded-lg text-amber-950 font-bold">
            <li><a href="/blogs/list" class="font-bold text-black hover:text-gray-500">Blog List</a></li>
            <li><a href="/admin/login-page" class="font-bold text-black hover:text-gray-500">Admin Login</a></li>
            <li><a href="/blogs/write" class="font-bold text-black hover:text-gray-500">Write Blog</a></li>
        </ul>
    </nav>
</div>

<div class="flex justify-center px-4 py-8">
    <div class="relative p-6 bg-[#2a2a2a] rounded-[40px] border-[12px] border-[#1a1a1a] shadow-[0_20px_50px_rgba(0,0,0,0.5),inset_0_2px_5px_rgba(255,255,255,0.1)] w-full max-w-3xl">
        <div class="rounded-[20px] overflow-hidden shadow-[inset_0_5px_15px_rgba(0,0,0,0.8),0_1px_1px_rgba(255,255,255,0.1)]">
            <div class="bg-zinc-950 p-10 min-h-[300px] relative">
                <div class="w-full max-w-2xl mx-auto bg-black shadow-sm border border-slate-200 rounded-lg p-8">
                    <h1 class="font-mono text-green-500 [text-shadow:0_0_5px_rgba(34,197,94,0.8)] text-3xl mb-6 text-center">Write Blog Post</h1>

                    <form id="blog-form" class="space-y-4">
                        <div>
                            <label for="title" class="block mb-2 font-mono text-green-500">Title</label>
                            <input id="title" name="title" type="text" class="w-full rounded-md border border-zinc-700 bg-zinc-900 px-4 py-3 text-white focus:border-green-500 focus:outline-none" required />
                        </div>

                        <div>
                            <label for="date" class="block mb-2 font-mono text-green-500">Date (optional)</label>
                            <input id="date" name="date" type="text" placeholder="MM-dd-yyyy" class="w-full rounded-md border border-zinc-700 bg-zinc-900 px-4 py-3 text-white focus:border-green-500 focus:outline-none" />
                        </div>

                        <div>
                            <label for="tags" class="block mb-2 font-mono text-green-500">Tags (comma-separated)</label>
                            <input id="tags" name="tags" type="text" placeholder="update, project, devlog" class="w-full rounded-md border border-zinc-700 bg-zinc-900 px-4 py-3 text-white focus:border-green-500 focus:outline-none" />
                        </div>

                        <div>
                            <label for="content" class="block mb-2 font-mono text-green-500">Content</label>
                            <textarea id="content" name="content" rows="10" class="w-full rounded-md border border-zinc-700 bg-zinc-900 px-4 py-3 text-white focus:border-green-500 focus:outline-none" required></textarea>
                        </div>

                        <div class="action-row flex flex-wrap gap-3 pt-2">
                            <button type="submit" class="action-btn action-btn-save rounded-md bg-green-600 px-4 py-2 font-semibold text-white hover:bg-green-500" style="background-color:#16a34a;color:#ffffff;border:1px solid #bbf7d0;">Save Blog</button>
                            <a href="/blogs/list" class="action-btn action-btn-list rounded-md bg-amber-600 px-4 py-2 font-semibold text-black hover:bg-amber-500" style="background-color:#f59e0b;color:#111827;border:1px solid #fde68a;">View Blog List</a>
                        </div>
                    </form>

                    <p id="message" class="mt-6 text-center font-mono text-sm"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('blog-form');
    const messageElement = document.getElementById('message');

    function setMessage(text, isError = false) {
        messageElement.textContent = text;
        messageElement.className = `mt-6 text-center font-mono text-sm ${isError ? 'text-red-400' : 'text-green-400'}`;
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();

        const formData = new FormData(form);
        const rawTags = (formData.get('tags') || '').toString();

        const payload = {
            title: (formData.get('title') || '').toString().trim(),
            content: (formData.get('content') || '').toString().trim(),
            date: (formData.get('date') || '').toString().trim(),
            tags: rawTags.length === 0
                ? []
                : rawTags.split(',').map(tag => tag.trim()).filter(Boolean)
        };

        const response = await fetch('/blogs', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        let data = null;
        try {
            data = await response.json();
        } catch {
            data = null;
        }

        if (!response.ok) {
            const errorMessage = data?.message || `Save failed (${response.status}). Make sure you are logged in as admin.`;
            setMessage(errorMessage, true);
            return;
        }

        const fileName = data?.fileName || 'created file';
        setMessage(`Saved successfully: ${fileName}`);
        form.reset();
    });
</script>
</body>
</html>
